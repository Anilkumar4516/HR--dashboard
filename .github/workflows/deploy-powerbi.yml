name: Power BI Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Multi_Domain_Analytics.pbip'
      - 'Multi_Domain_Analytics.Dataset/**'
      - 'Multi_Domain_Analytics.Report/**'
      - '01_Data/**'
      - '09_Deployment/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'DEV'
        type: choice
        options:
          - DEV
          - TEST
          - PROD

permissions:
  contents: read
  id-token: write

jobs:
  validate-model:
    name: Validate Tabular Model & DAX
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify PBIP Model JSON Schema
        shell: pwsh
        run: |
          Write-Host "Validating Multi_Domain_Analytics.Dataset\model.bim syntax..."
          $bimContent = Get-Content -Raw -Path "Multi_Domain_Analytics.Dataset\model.bim" | ConvertFrom-Json
          if ($bimContent.model.tables.Count -lt 4) {
              Write-Error "Validation Error: Less than 4 tables declared in model.bim"
          }
          Write-Host "Model validation passed! $($bimContent.model.tables.Count) tables verified." -ForegroundColor Green

  deploy-to-powerbi:
    name: Deploy to Power BI Service
    needs: validate-model
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Power BI Management Tools
        shell: pwsh
        run: |
          Install-Module -Name MicrosoftPowerBIMgmt -Scope CurrentUser -Force -AllowClobber

      - name: Execute Deployment Script
        shell: pwsh
        run: |
          $envTarget = "${{ github.event.inputs.target_env || 'PROD' }}"
          Write-Host "Deploying to Environment: $envTarget"
          
          .\09_Deployment\Deploy_To_PowerBI_Service.ps1 `
            -Environment $envTarget `
            -AuthMode "ServicePrincipal" `
            -TenantId "${{ secrets.POWERBI_TENANT_ID }}" `
            -ClientId "${{ secrets.POWERBI_CLIENT_ID }}" `
            -ClientSecret "${{ secrets.POWERBI_CLIENT_SECRET }}"
